<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>longhai2966</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #061b4f, #0867c9, #11b5e4);
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 22px;
      text-align: center;

      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;

      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .avatar {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid white;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin: 8px 0 22px;
      opacity: 0.85;
    }

    .qr-box {
      background: white;
      padding: 12px;
      border-radius: 20px;
      width: 100%;
      max-width: 330px;
      margin: auto;
    }

    .qr {
      width: 100%;
      display: block;
      border-radius: 12px;
    }

    .text {
      margin: 18px 0;
      font-size: 14px;
    }

    .tiktok-button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;

      width: 100%;
      padding: 15px;

      background: white;
      color: #061b4f;

      border-radius: 15px;
      text-decoration: none;

      font-size: 17px;
      font-weight: bold;

      transition: 0.2s;
    }

    .tiktok-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .tiktok-icon {
      font-size: 24px;
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Ảnh -->
    <img
      class="avatar"
      src="459.jpg"
      alt="Long Hải"
    >

    <!-- Tên -->
    <h1>longhai2966</h1>

    <p class="subtitle">
      Trang cá nhân của Long Hải
    </p>

    <!-- Mã QR -->
    <div class="qr-box">
      <img
        class="qr"
        src="459.jpg"
        alt="Mã QR"
      >
    </div>

    <p class="text">
      Quét mã QR để chuyển tiền
    </p>

    <!-- Nút TikTok -->
    <a
      class="tiktok-button"
      href="https://www.tiktok.com/@longhai2966"
      target="_blank"
    >
      <span class="tiktok-icon">♪</span>
      <span>Đi đến TikTok</span>
    </a>

    <footer>
      © 2026 longhai2966
    </footer>

  </div>

</body>
</html>
